# Sweep configuration
sweep:
  method: grid
  metric:
    name: holdout_r2_score
    goal: maximize


# Base configuration
config_overlay:

  # THIS LINE IS ADDED TO THIS FILE 
  # BECAUSE OF CHANGES THAT HAPPENED 
  # TO PLATIGLIB BETWEEN THE PREVIOUS
  # YAML CONFIGS AND THE CURRENT ONE
  platiglib_project: rbpse

  dataset:
    name: RBPSEDataset
    three_exon_combos: all
    window: 100
    min_read_count: 40

    features: 
      binding_matrix: 
        binding_format: 'binary'
        in_silico_kd: true

    fold_filter:
      num_folds: 5
      fold_index: 1
      group_column: ensembl_gene_id
      side: train
      seed: 17
  
  training:
    seed: 100

    data_split:
      method: cross_validation
      num_folds: 5
      group_column: 'ensembl_gene_id'
      validate_frac_of_train: 0.10

    wandb:
      project: yogi-xgbregressor-hyperparameter-sweep-march-2025
  
  model:
    name: XGBRegressor

    min_child_weight: 1
    gamma: 0

    subsample: 1
    colsample_bytree: 1

    reg_alpha: 0
    reg_lambda: 1

# Parameters to sweep
parameters:

  dataset.cell_line:
    values: [K562, HepG2]
  
  model.n_estimators: 
    values: [200, 250, 500]
  model.max_depth: 
    values: [3, 5, 7]
  model.learning_rate: 
    values: [0.05, 0.1, 0.15]
# Sweep configuration
sweep:
  method: grid
  metric:
    name: holdout_r2_score
    goal: maximize

# Base configuration
config_overlay:

  platiglib_project: rbpse

  dataset:
    name: RBPSEDataset
    three_exon_combos: all
    window: 100
    min_read_count: 40

    features: 
      binding_matrix: 
        binding_format: 'binary'
        in_silico_kd: true

    fold_filter:
      num_folds: 5
      fold_index: 1
      group_column: ensembl_gene_id
      side: train
      seed: 17
  
  training:

    data_split:
      method: cross_validation
      num_folds: 5
      group_column: 'ensembl_gene_id'
      validate_frac_of_train: 0.10

    sample_importance: 
      method: inverse_freq

    wandb:
      project: yogi-sample-importance-fall-2025
  
  model:
    name: XGBRegressor

    # CONSTANT BASE HYPERPARAMETERS
    n_jobs: -1
    eval_metric: ['rmse', 'logloss']
    n_estimators: 100000

    # FIXING OTHER HYPERPARMETERS
    min_child_weight: 1
    gamma: 0 
    subsample: 1
    colsample_bytree: 1
    reg_lambda: 1
    reg_alpha: 0


# Parameters to sweep
parameters:

  # INCLUDED IN ALL SWEEPS
  dataset.cell_line:
    values: [K562, HepG2]
  training.seed: 
    values: [100, 300, 500]

  # SAMPLE_WEIGHTING, EARLY STOPPING, LEARNING RATE, MAX DEPTH
  training.sample_importance.num_bins:
    values: [2, 3, 4, 5, 10, 20]
  model.early_stopping_rounds: 
    values: [10, 100, 500]
  model.learning_rate:
    values: [0.01, 0.05, 0.1, 0.15, 0.3,]
  model.max_depth:
    values: [3, 5, 7, 9,]
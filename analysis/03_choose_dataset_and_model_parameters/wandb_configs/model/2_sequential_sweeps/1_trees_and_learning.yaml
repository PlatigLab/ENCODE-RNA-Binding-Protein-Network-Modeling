# Sweep configuration
sweep:
  name: 1:early_stopping_rounds-learning_rate-max_depth
  project: yogi-rbp-ml-gencode-v24-v29-matching-exons

  method: grid
  metric:
    name: holdout_r2_score
    goal: maximize

# Base configuration
config_overlay:

  platiglib_project: rbpse

  dataset:
    name: RBPSEDataset
    data_source: 
      EncodeRBPBindingDataSource:
        three_exon_combos: all
        min_read_count: 40
        window: 100

    features: 
      binding_matrix: 
        binding_format: 'binary'
        in_silico_kd: true

    fold_filter:
      num_folds: 5
      fold_index: 1
      group_column: ensembl_gene_id
      side: train
      seed: 17
  
  training:

    data_split:
      method: cross_validation
      num_folds: 5
      group_column: 'ensembl_gene_id'
      validate_frac_of_train: 0.10
  
  model:
    name: XGBRegressor

    # CONSTANT BASE HYPERPARAMETERS
    n_jobs: -1
    eval_metric: ['rmse', 'logloss']
    n_estimators: 100000
    early_stopping_rounds: 100

    # FIXING OTHER HYPERPARMETERS
    min_child_weight: 1
    gamma: 0 
    subsample: 1
    colsample_bytree: 1
    reg_lambda: 1
    reg_alpha: 0


# Parameters to sweep
parameters:

  # INCLUDED IN ALL SWEEPS
  training.seed: 
    values: [100, 200, 300, 400, 500, 600, 700]

  dataset.data_source.EncodeRBPBindingDataSource.cell_line:
    values: [K562, HepG2]
    
  # LEARNING RATE, MAX DEPTH
  model.learning_rate:
    values: [0.01, 0.05, 0.1, 0.2, 0.3]
  model.max_depth:
    values: [3, 5, 7, 9, 11]
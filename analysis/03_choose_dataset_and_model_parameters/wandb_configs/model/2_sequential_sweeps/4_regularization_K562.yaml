# Sweep configuration
sweep:
  name: 4:reg_alpha-reg_lambda:K562
  project: yogi-rbp-ml-gencode-v24-v29-matching-exons

  method: grid
  metric:
    name: holdout_r2_score
    goal: maximize

# Base configuration
config_overlay:

  platiglib_project: rbpse

  dataset:
    name: RBPSEDataset
    data_source: 
      EncodeRBPBindingDataSource:
        cell_line: K562
        three_exon_combos: all
        min_read_count: 40
        window: 100

    features: 
      binding_matrix: 
        binding_format: 'binary'
        in_silico_kd: true

    fold_filter:
      num_folds: 5
      fold_index: 1
      group_column: ensembl_gene_id
      side: train
      seed: 17
  
  training:

    data_split:
      method: cross_validation
      num_folds: 5
      group_column: 'ensembl_gene_id'
      validate_frac_of_train: 0.10
  
  model:
    name: XGBRegressor

    # CONSTANT BASE HYPERPARAMETERS
    n_jobs: -1
    eval_metric: ['rmse', 'logloss']
    n_estimators: 100000
    early_stopping_rounds: 100

    # FROM PREVIOUS SWEEPS
    learning_rate: 0.01
    max_depth: 5

    min_child_weight: 50
    gamma: 1.0

    subsample: 0.75
    colsample_bytree: 0.25


# Parameters to sweep
parameters:

  training.seed: 
    values: [100, 200, 300, 400, 500, 600, 700]

  # REGULARIZATION
  model.reg_alpha:
    values: [0, 0.2, 0.5, 0.8, 1]
  model.reg_lambda:
    values: [0.1, 0.5, 1, 5, 10]

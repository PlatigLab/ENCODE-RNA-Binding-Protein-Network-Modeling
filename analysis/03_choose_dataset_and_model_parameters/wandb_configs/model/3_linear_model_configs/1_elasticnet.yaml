# Sweep configuration
sweep:
  name: ElasticNet
  project: yogi-linear-models-gencode-v24-v29-matching-exons

  method: grid
  metric:
    name: holdout_r2_score
    goal: maximize

# Base configuration
config_overlay:

  platiglib_project: rbpse

  dataset:
    name: RBPSEDataset
    data_source: 
      EncodeRBPBindingDataSource:
        three_exon_combos: all
        min_read_count: 40
        window: 100

    features: 
      binding_matrix: 
        binding_format: 'binary'
        in_silico_kd: true

    fold_filter:
      num_folds: 5
      fold_index: 1
      group_column: ensembl_gene_id
      side: train
      seed: 17
  
  training:
    data_split:
      method: cross_validation
      num_folds: 5
      group_column: 'ensembl_gene_id'
    
    profile: 
      metrics: [r2_score, rmse, sigmoid_r2]
  
  model:
    name: ElasticNet


# Parameters to sweep
parameters:

  # INCLUDED IN ALL SWEEPS
  training.seed: 
    values: [100, 200, 300, 400, 500, 600, 700]

  dataset.data_source.EncodeRBPBindingDataSource.cell_line:
    values: [K562, HepG2]

  # REGULARIZATION
  model.alpha:
    values: [.0001, .0005, .001, .005, .01, .05, .1, .5, 1, 5, 10, 50, 100]
  model.l1_ratio:
    values: [0.1, 0.25, 0.5, 0.75, 0.9, 1]
# Sweep configuration
sweep:
  method: grid
  metric:
    name: holdout_r2_score
    goal: maximize

# Base configuration
config_overlay:

  dataset:
    name: RBPSEDataset
    three_exon_combos: all
    window: 100
    min_read_count: 40

    features: 
      binding_matrix: 
        binding_format: 'binary'
        in_silico_kd: true

    fold_filter:
      num_folds: 5
      fold_index: 1
      group_column: ensembl_gene_id
      side: train
      seed: 17
  
  training:

    data_split:
      method: cross_validation
      num_folds: 5
      group_column: 'ensembl_gene_id'
      validate_frac_of_train: 0.10

    wandb:
      project: yogi-xgbregressor-hyperparameter-sweep-march-2025
  
  model:
    name: XGBRegressor


# Parameters to sweep
parameters:

  # INCLUDED IN ALL SWEEPS
  dataset.cell_line:
    values: [K562, HepG2]
  training.seed: 
    values: [100, 200, 300, 400, 500, 600, 700, 800, 900]

  # LEARNING RATE & NUM TREES
  model.learning_rate:
    values: [0.01, 0.05, 0.15, 0.3]
  model.n_estimators:
    values: [200, 500, 1000, 2000, 5000]
  
  # TREE COMPLEXITY AND STRUCTURE
  model.max_depth:
    values: [3, 5, 7, 9]
  model.min_child_weight:
    values: [1, 3, 5]
  model.gamma:
    values: [0, 0.1, 0.3]

  # COLUMN AND ROW SAMPLING
  model.subsample:
    values: [0.8, 1]
  model.colsample_bytree:
    values: [0.8, 1]

  # REGULARIZATION
  model.reg_alpha:
    values: [0, 0.1, 0.5, 1]
  model.reg_lambda:
    values: [1, 3, 5, 10]

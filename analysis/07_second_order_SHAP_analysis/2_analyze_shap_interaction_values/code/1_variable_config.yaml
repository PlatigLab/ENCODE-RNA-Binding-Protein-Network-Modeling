# Valid feature metrics that can be calculated
VALID_FEATURE_METRICS: [
    "Signed-Local-SHAP-Mean-Bound-Only",
    "Bound-Only",
    "Global-SHAP",
    "NOT-Bound-Only",
    "Signed-Local-SHAP-Mean-NOT-Bound-Only"
]

# Feature & RBP Info
RBP_FEATURE_INFO_FILE: "../outputs/feature_info/rbp_feature_info.json"

# FIGURES
FIGURES: 
    side_by_side_heatmap_dir: "../outputs/figures/side_by_side_heatmaps/"

# PPI Info 
PPI_MODES: ["recy2h", "street_et_al", "combined"]

PPI_INFO: 
    cached_ppi_file: "../outputs/ppi_info/recy2h_and_street_et_al_rbp_ppi.tsv"
    
    recy2h_ppi_dir: 
        all_rbps_screened: "../../../../inputs/RBP-RBP_PPI/all_rbps_screened.xlsx"
        results: "../../../../inputs/RBP-RBP_PPI/lang_et_al_rec-y2h_screening_results.xlsx"
        uniprot_mapping: "../../../../inputs/RBP-RBP_PPI/uniprot_mapping.tsv"

    street_et_al: 
        all_rbps_screened: "../../../05_retrieve_gene_yeo_RBP_PPIs_street_et_al_molecular_cell/INPUT_street_et_al_gene_yeo_molecular_cell_table_s1_ip_ms_baits.xlsx"
        table_s2_full_results: "../../../05_retrieve_gene_yeo_RBP_PPIs_street_et_al_molecular_cell/INPUT_street_et_al_gene_yeo_molecular_cell_table_s2_full_ppi.csv"
        table_s3_output: "../../../05_retrieve_gene_yeo_RBP_PPIs_street_et_al_molecular_cell/OUTPUT_street_et_al_gene_yeo_molecular_cell_table_s3_encode_rbps.json"


CELL_LINES: ["HepG2", "K562"]

# UBP IDs and Interaction Values
UBP_ID_DIR: "../../1_generate_shap_interaction_values/outputs/ubp_ID_tables/"
UBP_COL_NAME: "Unique Binding Pattern ID #"

COLS_PER_JOB: 500

INTERACTION_VALUES_DIR: "../../1_generate_shap_interaction_values/outputs/flattened_interaction_value_tables/"

TMP_CACHE_DIR: "../TMP_CACHE/"

# SLURM Batch Prefixes
SBATCH_PREFIXES: [
    "sbatch --account=platiglab --partition=standard -n8 --mem=64GB --time=23:00:00", 
    "sbatch --account=platiglab --partition=parallel -N2 -n8 --mem=32GB --time=23:00:00",
]

# SHAP averages 
SHAP_AVG_DIR: "../outputs/SHAP_cache/averages/"
dataset: 
        cell_lines: 
            [K562, HepG2]

        distances: 
            [50, 100, 150, 200, 250, 500]

        control_only: 
            [False, True]

        psi_subsets: 
            [null, [0, 1], [0.1, 0.9]]

        read_count_quantiles: 
            [null, 0.1, 0.2, 0.4,]

        data_flavors: 
            [binary, num_peaks, rbp_exp, rbp_exp_peak]

        count_normalization_methods: 
            [getmm, tmm]

        log_counts: 
            [False, True]


modeling:
        models: [OLSRegression, ElasticNetContinuous, OLSOrdinalRegression, ElasticNetOrdinal, OrdinalGBT]
        random_states: [17, 97]
        ordinal_regression_method: [logit, probit]
        data_splitting_method: "gene"
        train_split: 0.7
        test_split: 0.15
        validate_split: 0.15
        alpha: [0.001, 0.01, 0.1, 1, 10]
        l1_ratio: [0, 0.2, 0.4, 0.6, 0.8, 1]


SLURM:
        plots_folder: "../output/plots/"